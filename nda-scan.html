<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PressureWerx — Scan to Continue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;700;900&family=Barlow+Condensed:wght@300;400;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--red:#E8291C;--black:#0a0a0a;--white:#fff;--grey-dark:#111;--grey-mid:#2a2a2a;--grey-light:#888;--grey-subtle:#444}
  html,body{height:100%}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Barlow',sans-serif;
    font-weight:300;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align:center;
  }
  body::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 38%,#1c0b08 0%,#0a0a0a 65%);
    pointer-events:none;
  }

  .logo-lockup{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
  .brand-name{font-weight:700;font-size:clamp(24px,7vw,32px);letter-spacing:-1px;color:var(--white);line-height:1;white-space:nowrap}

  .divider{width:100%;max-width:280px;height:1px;background:var(--grey-mid);margin:22px 0 18px;position:relative;z-index:1}

  .tagline{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:300;
    font-size:clamp(20px,6.5vw,26px);
    line-height:1.35;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--grey-light);
    position:relative;
    z-index:1;
  }
  .tagline em{font-style:normal;color:var(--red)}

  .qr-card{
    position:relative;
    z-index:1;
    margin-top:34px;
    width:min(78vw,320px);
    aspect-ratio:1/1;
    background:var(--white);
    border-radius:14px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 1px var(--grey-mid),0 20px 60px rgba(0,0,0,.5);
  }
  .qr-card svg{width:100%;height:100%;display:block}

  .qr-caption{
    position:relative;
    z-index:1;
    margin-top:22px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--grey-light);
  }
  .qr-url{
    position:relative;
    z-index:1;
    margin-top:8px;
    font-size:13px;
    color:var(--grey-subtle);
    word-break:break-all;
  }
  .qr-url a{color:var(--grey-subtle);text-decoration:none;border-bottom:1px solid var(--grey-mid);padding-bottom:1px}

  .red-bar{position:absolute;bottom:0;left:0;width:100%;height:4px;background:var(--red)}
</style>
</head>
