<style>
/* ── Reset & variables ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red:        #E8291C;
  --black:      #0a0a0a;
  --white:      #fff;
  --grey-mid:   #2a2a2a;
  --grey-light: #888;
  --grey-subtle:#444;
  /* vis-state palette (dark brand) */
  --brand-ink:  #e8e8e8;
  --brand-red:  #E8291C;
  --brand-bg:   #0a0a0a;
  --warm-grey:  #000000;
  --panel:      #111111;
  --border:     #2a2a2a;
  --muted:      #888888;
  --label:      #aaaaaa;
  --soft-shadow:0 0 0 1px rgba(255,255,255,.06);
}
html, body { height: 100%; }
body {
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
  background: var(--black);
  color: var(--white);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Landing state ──────────────────────────────────────────────────────── */
#landing {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  background: radial-gradient(ellipse at 50% 38%, #1c0b08 0%, #0a0a0a 65%);
}

.lc {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 480px;
}

.logo-lockup {
  display: flex;
  align-items: center;
  gap: 20px;
}
.brand-name {
  font-weight: 700;
  font-size: clamp(36px, 8vw, 56px);
  letter-spacing: -1.5px;
  line-height: 1;
  white-space: nowrap;
}

.l-divider {
  width: 100%;
  height: 1px;
  background: var(--grey-mid);
  margin: 24px 0 18px;
}

.tagline {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 300;
  font-size: clamp(13px, 3.5vw, 17px);
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--grey-light);
  margin-bottom: 36px;
  text-align: center;
}

/* Drop zone */
.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 180px;
  border: 2px dashed var(--grey-mid);
  border-radius: 8px;
  padding: 32px 24px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  position: relative;
  user-select: none;
}
.dropzone:hover,
.dropzone.drag-over {
  border-color: var(--red);
  background: rgba(232, 41, 28, .05);
}
.dz-icon {
  color: var(--grey-subtle);
  transition: color .15s;
  flex-shrink: 0;
}
.dropzone:hover .dz-icon,
.dropzone.drag-over .dz-icon { color: var(--red); }

.dz-primary {
  font-size: 15px;
  font-weight: 400;
  color: var(--white);
  text-align: center;
}
.dz-sub {
  font-size: 13px;
  color: var(--grey-light);
}
.dz-error {
  font-size: 13px;
  color: var(--red);
  text-align: center;
  margin-top: 2px;
  min-height: 18px;
}

.load-example {
  background: none;
  border: none;
  color: var(--grey-light);
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  cursor: pointer;
  margin-top: 18px;
  padding: 4px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--grey-subtle);
  transition: color .15s;
}
.load-example:hover { color: var(--white); }

/* ── Processing overlay ────────────────────────────────────────────────── */
#processing {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  z-index: 200;
}
#processing p {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--grey-light);
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--grey-mid);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Vis state ─────────────────────────────────────────────────────────── */
#vis {
  display: none;
  height: 100vh;
  padding: 8px;
  box-sizing: border-box;
  background: var(--brand-bg);
  color: var(--brand-ink);
  font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#vis.active { display: block; }

/* tabular figures on all readouts */
#vis .mono, #vis .values, #vis .time-values, #vis .meta-strip {
  font-variant-numeric: tabular-nums;
}

#vis .container {
  height: 100%;
  max-width: 1120px; margin: 0 auto;
  background: var(--panel);
  border-radius: 10px; padding: 10px 12px;
  box-sizing: border-box;
  box-shadow: var(--soft-shadow);
  display: flex; flex-direction: column;
}
#vis .v-header {
  display: flex; align-items: center; gap: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#vis .v-header .v-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
#vis .v-header .v-logo span {
  font-weight: 700; font-size: 15px; letter-spacing: -0.3px;
  color: var(--brand-ink);
}
#vis .meta-strip {
  display: flex; gap: 18px; align-items: baseline;
  font-size: 12px; color: var(--muted);
  margin-left: auto;
}
#vis .meta-strip strong { color: var(--brand-ink); font-weight: 600; margin-left: 4px; }
#vis .load-diff {
  background: none; border: none; padding: 0;
  font-size: 12px; color: var(--muted); cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
  margin-left: 8px; flex-shrink: 0;
}
#vis .load-diff:hover { color: var(--brand-ink); }

#vis #timegraph {
  flex: 0 0 130px;
  background: var(--warm-grey);
  border: 1px solid var(--border); border-radius: 6px;
  width: 100%; display: block; margin-top: 8px;
}
#vis #map {
  flex: 1 1 auto; min-height: clamp(200px, 40vh, 9999px);
  border-radius: 6px; margin-top: 6px;
  border: 1px solid var(--border);
}
#vis .controls {
  flex-shrink: 0;
  margin-top: 8px; padding: 8px 12px 6px 12px;
  background: var(--brand-bg); border-radius: 6px;
  border: 1px solid var(--border);
}
#vis .slider-title {
  font-size: 10px; font-weight: 600; color: var(--label);
  margin: 4px 4px 0 4px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
#vis .slider-wrap  { position: relative; margin: 2px 4px; height: 26px; }
#vis .slider-track {
  position: absolute; top: 11px; left: 0; right: 0; height: 6px;
  background: #2a2a2a; border-radius: 3px;
}
#vis .slider-range {
  position: absolute; top: 11px; height: 6px;
  background: linear-gradient(to right,
    #2c7bb6 0%,#abd9e9 25%,#ffffbf 50%,#fdae61 75%,#d7191c 100%);
  border-radius: 3px; pointer-events: none;
}
#vis .slider-thumb {
  position: absolute; top: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: #e8e8e8; border: 2px solid var(--label);
  cursor: grab; transform: translateX(-11px); user-select: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.6);
  transition: box-shadow 60ms ease;
}
#vis .slider-thumb:hover { box-shadow: 0 2px 6px rgba(0,0,0,.8); }
#vis .slider-thumb:active { cursor: grabbing; }
#vis .thumb-min { border-color: #2c7bb6; }
#vis .thumb-max { border-color: #d7191c; }
#vis .values {
  display: flex; justify-content: space-between;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 12px; padding: 0 4px;
}
#vis .val-min { color: #2c7bb6; font-weight: 600; }
#vis .val-max { color: #d7191c; font-weight: 600; }
#vis .info { font-size: 10px; color: var(--muted); margin-top: 2px; }
#vis button {
  padding: 4px 11px; font-size: 11px;
  border-radius: 5px; border: 1px solid #2a2a2a;
  background: #1a1a1a; color: var(--brand-ink);
  cursor: pointer; margin-right: 5px; margin-top: 4px;
  font-weight: 500;
  transition: background 80ms ease, border-color 80ms ease;
}
#vis button:hover  { background: #242424; border-color: #888; }
#vis button:active { background: #2a2a2a; }
/* Time slider */
#vis .time-slider-wrap { position: relative; margin: 2px 4px; height: 26px; }
#vis .time-slider-track {
  position: absolute; top: 11px; left: 0; right: 0; height: 6px;
  background: #2a2a2a; border-radius: 3px;
}
#vis .time-slider-range {
  position: absolute; top: 11px; height: 6px;
  background: #666666; border-radius: 3px; pointer-events: none;
}
#vis .time-thumb {
  position: absolute; top: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: #e8e8e8; border: 2px solid var(--label);
  cursor: grab; transform: translateX(-11px); user-select: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.6);
  transition: box-shadow 60ms ease;
}
#vis .time-thumb:hover  { box-shadow: 0 2px 6px rgba(0,0,0,.8); }
#vis .time-thumb:active { cursor: grabbing; }
#vis .time-values {
  display: flex; justify-content: space-between;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 12px; padding: 0 4px; color: var(--label);
}
#vis .time-values .duration { color: var(--muted); }
@media (pointer: coarse) {
  #vis .slider-thumb, #vis .time-thumb {
    width: 28px; height: 28px; top: 1px; transform: translateX(-14px);
  }
  #vis .slider-wrap, #vis .time-slider-wrap { height: 30px; }
  #vis .load-diff {
    font-size: 13px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 4px;
    min-height: 36px; display: inline-flex; align-items: center;
  }
}

/* ── Mobile ────────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .dropzone { min-height: clamp(120px, 25vw, 180px); padding: 20px 16px; }
}
@media (max-width: 768px) {
  #vis .meta-strip { gap: 12px; font-size: 11px; }
}
@media (max-width: 580px) {
  #vis .meta-strip .meta-sm-hide { display: none; }
  #vis .meta-strip {
    overflow-x: auto; white-space: nowrap; gap: 10px;
    scrollbar-width: none;
  }
  #vis .meta-strip::-webkit-scrollbar { display: none; }
}
@media (max-width: 420px) {
  #vis .meta-strip strong#metaFile {
    max-width: 120px; overflow: hidden;
    text-overflow: ellipsis; display: inline-block; vertical-align: bottom;
  }
}
@media (max-width: 480px) {
  .logo-lockup { gap: 14px; }
  .logo-lockup svg { width: 52px; height: 52px; }
  .brand-name { letter-spacing: -1px; }
  .tagline { letter-spacing: 3px; }
}
.leaflet-tooltip {
  background: #1a1a1a;
  border: 1px solid #555;
  border-radius: 3px;
  color: #e0e0e0;
  font-size: 11px;
  padding: 3px 7px;
  box-shadow: none;
  white-space: nowrap;
}
.leaflet-tooltip::before { display: none; }
</style>
</head>
<body>

<!-- ══════════════════ Landing state ══════════════════ -->
<div id="landing">
  <div class="lc">

    <div class="logo-lockup">
      <svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 13.6 71 A 42 42 0 1 1 86.4 71" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="10" fill="#E8291C"/>
        <polygon points="50,42 44,48 22,24" fill="#E8291C"/>
        <polygon points="50,42 56,48 22,24" fill="#E8291C"/>
      </svg>
      <div class="brand-name">PressureWerx</div>
    </div>

    <div class="l-divider"></div>
    <p class="tagline">Wing Pressure Analysis</p>

    <label class="dropzone" id="dropzone" for="fileInput">
      <svg class="dz-icon" width="38" height="38" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <polyline points="16 16 12 12 8 16"/>
        <line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
      <span class="dz-primary">Drop a .fit or .zip file here</span>
      <span class="dz-sub">or click to browse</span>
      <span class="dz-error" id="dzError" aria-live="polite"></span>
      <input type="file" id="fileInput" accept=".fit,.zip" style="display:none" aria-label="Choose a FIT or ZIP file">
    </label>

    <button class="load-example" id="loadExample" type="button">
      Load example session
    </button>

  </div>
</div>

<!-- ══════════════════ Processing overlay ══════════════════ -->
<div id="processing" style="display:none" aria-live="polite" aria-label="Parsing file">
  <div class="spinner"></div>
  <p>Parsing&hellip;</p>
</div>

<!-- ══════════════════ Visualization state ══════════════════ -->
<div id="vis">
  <div class="container">

    <div class="v-header">
      <div class="v-logo">
        <svg width="28" height="28" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 13.6 71 A 42 42 0 1 1 86.4 71" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="10" fill="#E8291C"/>
          <polygon points="50,42 44,48 22,24" fill="#E8291C"/>
          <polygon points="50,42 56,48 22,24" fill="#E8291C"/>
        </svg>
        <span>PressureWerx</span>
      </div>
      <div class="meta-strip">
        <span>File <strong id="metaFile">—</strong></span>
        <span class="meta-sm-hide">Date <strong id="metaDate">—</strong></span>
        <span>Time <strong id="metaTime">—</strong></span>
        <span>Duration <strong id="metaDur">—</strong></span>
        <span class="meta-sm-hide">Distance <strong id="metaDist">—</strong></span>
        <span>Mean <strong id="metaMean">—</strong></span>
      </div>
      <button class="load-diff" id="loadDiff" type="button">Load different file</button>
    </div>

    <svg id="timegraph" viewBox="0 0 900 130" preserveAspectRatio="none"></svg>

    <div id="map"></div>

    <div class="controls">
      <div class="slider-title">Pressure Window</div>
      <div class="slider-wrap" id="sliderWrap">
        <div class="slider-track"></div>
        <div class="slider-range" id="sliderRange"></div>
        <div class="slider-thumb thumb-min" id="thumbMin"></div>
        <div class="slider-thumb thumb-max" id="thumbMax"></div>
      </div>
      <div class="values">
        <span class="val-min">Blue = <span id="vminLbl">—</span> PSI</span>
        <span class="val-max">Red = <span id="vmaxLbl">—</span> PSI</span>
      </div>

      <div class="slider-title" style="margin-top:8px">Time Window</div>
      <div class="time-slider-wrap" id="timeSliderWrap">
        <div class="time-slider-track"></div>
        <div class="time-slider-range" id="timeRange"></div>
        <div class="time-thumb" id="timeThumbStart"></div>
        <div class="time-thumb" id="timeThumbEnd"></div>
      </div>
      <div class="time-values">
        <span>Start: <strong id="timeStartLbl">—</strong></span>
        <span class="duration">Window: <strong id="timeDurLbl">—</strong></span>
        <span>End: <strong id="timeEndLbl">—</strong></span>
      </div>

      <div style="margin-top:4px">
        <button id="resetDefaults">Reset color</button>
        <button id="resetData">Full data range</button>
        <button id="resetTime">Full time</button>
        <span class="info" id="dataRangeInfo" style="margin-left:8px"></span>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
'use strict';

// ── FIT constants ────────────────────────────────────────────────────────────
const SEMI      = 180 / 2147483648;
const FIT_EPOCH = 631065600;   // seconds between 1989-12-31 and Unix epoch
const BASE_SIZE = {
  0x00:1, 0x01:1, 0x02:1,
  0x83:2, 0x84:2,
  0x85:4, 0x86:4, 0x88:4, 0x89:8,
  0x8a:1, 0x8b:2, 0x8c:4,
  0x07:1,
  0x8e:8, 0x8f:8, 0x90:8,
};

// ── FIT binary parser (DataView, browser-native) ─────────────────────────────
function parseFit(ab) {
  const u8 = new Uint8Array(ab);
  const dv = new DataView(ab);

  if (String.fromCharCode(u8[8], u8[9], u8[10], u8[11]) !== '.FIT')
    throw new Error('Not a valid FIT file');

  const headerSize = u8[0];
  const endOfData  = headerSize + dv.getUint32(4, /*le=*/true);

  const localDefs = {};   // local type → definition
  const devFields = {};   // devDataIndex → { fieldDefNum → {name, size, …} }
  let   lastTs    = 0;
  const records   = [];
  let   pos       = headerSize;

  while (pos < endOfData - 2) {
    const hdr = u8[pos++];

    // Compressed timestamp header (bit 7 set)
    if (hdr & 0x80) {
      const lt   = (hdr >> 5) & 0x03;
      const to   = hdr & 0x1F;
      const cand = (lastTs & 0xFFFFFFE0) | to;
      lastTs = cand >= lastTs ? cand : cand + 32;
      const def = localDefs[lt];
      if (def) {
        const [rec, bytes] = _readMsg(u8, dv, pos, def, devFields);
        pos += bytes;
        if (def.globalNum === 20) {
          rec.timestamp = lastTs;
          _cvtGPS(rec);
          records.push(rec);
        }
      }
      continue;
    }

    const isDef  = (hdr >> 6) & 1;
    const hasDev = isDef && !!((hdr >> 5) & 1);
    const lt     = hdr & 0x0F;

    // Definition message
    if (isDef) {
      pos++;  // reserved byte
      const be = u8[pos++] === 1;
      const gn = be ? dv.getUint16(pos) : dv.getUint16(pos, true); pos += 2;
      const nf = u8[pos++];
      const fields = [];
      for (let i = 0; i < nf; i++) {
        fields.push({ defNum: u8[pos], size: u8[pos+1], baseType: u8[pos+2] });
        pos += 3;
      }
      const devFDs = [];
      if (hasDev) {
        const nd = u8[pos++];
        for (let i = 0; i < nd; i++) {
          devFDs.push({ defNum: u8[pos], size: u8[pos+1], devDataIdx: u8[pos+2] });
          pos += 3;
        }
      }
      localDefs[lt] = { globalNum: gn, be, fields, devFieldDefs: devFDs };
      continue;
    }

    // Data message
    const def = localDefs[lt];
    if (!def) { console.warn('parseFit: no definition for local type', lt); break; }

    const [rec, bytes] = _readMsg(u8, dv, pos, def, devFields);
    pos += bytes;

    if (def.globalNum === 206) {
      // field_description: register developer field metadata
      const di = rec.f0, fn = rec.f1, bt = rec.f2, name = rec.f3 || '';
      if (di != null && fn != null && name) {
        if (!devFields[di]) devFields[di] = {};
        devFields[di][fn] = { name, size: BASE_SIZE[bt] || 4 };
      }
    } else if (def.globalNum === 20) {
      if (rec.timestamp != null) lastTs = rec.timestamp;
      _cvtGPS(rec);
      records.push(rec);
    } else {
      if (rec.timestamp != null) lastTs = rec.timestamp;
    }
  }

  return { records, devFields };
}

function _readMsg(u8, dv, pos, def, devFields) {
  const { globalNum, be, fields, devFieldDefs } = def;
  const rec = {};
  let   off = 0;

  for (const f of fields) {
    const v = _rdVal(u8, dv, pos + off, f.baseType, f.size, be);
    off += f.size;
    if (globalNum === 20) {
      if      (f.defNum === 253) rec.timestamp = v;
      else if (f.defNum === 0)   rec.raw_lat   = v;
      else if (f.defNum === 1)   rec.raw_lon   = v;
    } else if (globalNum === 206) {
      rec['f' + f.defNum] = v;
    }
  }

  for (const df of devFieldDefs || []) {
    const v = _rdVal(u8, dv, pos + off, 0x88, df.size, be);
    off += df.size;
    if (globalNum === 20) {
      const dfi = devFields[df.devDataIdx];
      if (dfi) { const m = dfi[df.defNum]; if (m) rec[m.name] = v; }
    }
  }

  return [rec, off];
}

function _rdVal(u8, dv, pos, bt, size, bigEndian) {
  const le = !bigEndian;
  if (bt === 0x88) return dv.getFloat32(pos, le);
  if (bt === 0x89) return dv.getFloat64(pos, le);
  if (bt === 0x07) {                               // string
    let s = '';
    for (let i = 0; i < size; i++) {
      const c = u8[pos + i];
      if (c === 0) break;
      s += String.fromCharCode(c);
    }
    return s;
  }
  const sgn = bt === 0x01 || bt === 0x83 || bt === 0x85 || bt === 0x8e;
  if (size === 1) return sgn ? dv.getInt8(pos)         : dv.getUint8(pos);
  if (size === 2) return sgn ? dv.getInt16(pos, le)    : dv.getUint16(pos, le);
  if (size === 4) return sgn ? dv.getInt32(pos, le)    : dv.getUint32(pos, le);
  return dv.getUint8(pos);
}

function _cvtGPS(rec) {
  if (rec.raw_lat != null) {
    rec.lat = rec.raw_lat === 0x7FFFFFFF ? null : rec.raw_lat * SEMI;
    rec.lon = rec.raw_lon === 0x7FFFFFFF ? null : rec.raw_lon * SEMI;
    delete rec.raw_lat; delete rec.raw_lon;
  }
}

// ── Processing pipeline ──────────────────────────────────────────────────────
// Savitzky-Golay coefficients: window=21, polyorder=3
// h[k] = 3*(3m²+3m−1−5k²) / ((2m−1)(2m+1)(2m+3)),  m=10
const SG_COEFFS = (() => {
  const m = 10, d = (2*m-1)*(2*m+1)*(2*m+3);
  return Array.from({ length: 21 }, (_, i) => { const k = i-m; return 3*(3*m*m+3*m-1-5*k*k)/d; });
})();

function _detectChannels(records) {
  const ch = {};
  for (const key of ['pressure_le', 'pressure_st', 'pressure_psi']) {
    const v = records.map(r => r[key] ?? 0);
    if (v.some(x => x !== 0)) ch[key] = v;
  }
  return ch;
}

function _fillZeros(arr) {
  const out = arr.slice();
  let i = 0;
  while (i < out.length) {
    if (out[i] !== 0) { i++; continue; }
    let j = i;
    while (j < out.length && out[j] === 0) j++;
    const l = i - 1, r = j;
    for (let k = i; k < j; k++) {
      if      (l  <  0)             out[k] = out[r];
      else if (r >= out.length)     out[k] = out[l];
      else  out[k] = out[l] + (out[r] - out[l]) * (k - l) / (r - l);
    }
    i = j;
  }
  return out;
}

function _savgol(arr) {
  const m = 10, n = arr.length;
  const pad = new Float64Array(n + 2*m);
  for (let i = 0; i < m; i++)    pad[i]     = arr[0];
  for (let i = 0; i < n; i++)    pad[i + m] = arr[i];
  for (let i = 0; i < m; i++)    pad[n+m+i] = arr[n-1];
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < 21; j++) s += SG_COEFFS[j] * pad[i + j];
    out[i] = s;
  }
  return out;
}

function _haversine(la1, lo1, la2, lo2) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (la2-la1)*r, dLo = (lo2-lo1)*r;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function _buildSegs(records, smoothed, tStart) {
  const DECIM = 2;
  // GPS-valid filter first, then decimate — matches Python pipeline behaviour
  const gps = records.map((r, i) => ({ r, p: smoothed[i] })).filter(x => x.r.lat != null);
  const segments = [], segSeconds = [];
  for (let i = 0; i + DECIM < gps.length; i += DECIM) {
    const a = gps[i], b = gps[i + DECIM];
    segments.push([
      +a.r.lat.toFixed(6), +a.r.lon.toFixed(6),
      +b.r.lat.toFixed(6), +b.r.lon.toFixed(6),
      +a.p.toFixed(4),
    ]);
    segSeconds.push(a.r.timestamp - tStart);
  }
  return { segments, segSeconds };
}

function processRecords(records) {
  const channels = _detectChannels(records);
  if (!Object.keys(channels).length) throw new Error('No pressure data found — check sensor pairing');

  const primaryKey  = 'pressure_le' in channels ? 'pressure_le'
                    : 'pressure_st' in channels ? 'pressure_st'
                    : 'pressure_psi';
  const rawPressure = channels[primaryKey];
  const smoothed    = _savgol(_fillZeros(rawPressure));

  const tStart = records[0].timestamp;
  const tEnd   = records[records.length - 1].timestamp;
  const { segments, segSeconds } = _buildSegs(records, smoothed, tStart);

  const validIdx  = rawPressure.map((v, i) => v !== 0 ? i : -1).filter(i => i >= 0);
  const vSmoothed = validIdx.map(i => smoothed[i]);
  const sortedP   = vSmoothed.slice().sort((a, b) => a - b);
  const pct       = (p) => sortedP[Math.max(0, Math.floor(sortedP.length * p) - 1)];

  const withGps = records.filter(r => r.lat != null);
  if (withGps.length === 0)
    throw new Error('No GPS data found in file — cannot build map track');
  const lats = withGps.map(r => r.lat), lons = withGps.map(r => r.lon);
  const latMin = Math.min(...lats), latMax = Math.max(...lats);
  const lonMin = Math.min(...lons), lonMax = Math.max(...lons);
  let totalDist = 0;
  for (let i = 1; i < withGps.length; i++)
    totalDist += _haversine(withGps[i-1].lat, withGps[i-1].lon, withGps[i].lat, withGps[i].lon);
  const meanLat = lats.reduce((a,b)=>a+b,0)/lats.length;
  const meanLon = lons.reduce((a,b)=>a+b,0)/lons.length;

  const toHMS = ts => new Date((ts + FIT_EPOCH)*1000).toISOString().slice(11, 19);
  const _DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const _MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const toDateStr = ts => {
    const d = new Date((ts + FIT_EPOCH)*1000);
    return `${_DAYS[d.getUTCDay()]}, ${String(d.getUTCDate()).padStart(2,'0')} ${_MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  };

  return {
    segments, seg_seconds: segSeconds,
    duration_s:    tEnd - tStart,
    t_date_str:    toDateStr(tStart),
    t_start_str:   toHMS(tStart),
    t_end_str:     toHMS(tEnd),
    data_min:      sortedP[0],
    data_max:      sortedP[sortedP.length - 1],
    default_min:   pct(0.10),
    default_max:   pct(0.90),
    mean_pressure: vSmoothed.reduce((a,b)=>a+b,0) / vSmoothed.length,
    total_dist_km: totalDist / 1000,
    center: [meanLat, meanLon],
    bbox:   [[latMin, lonMin], [latMax, lonMax]],
    start:  [withGps[0].lat, withGps[0].lon],
    end:    [withGps[withGps.length-1].lat, withGps[withGps.length-1].lon],
    primaryKey,
  };
}

// ── File intake (uses JSZip) ─────────────────────────────────────────────────
async function extractFit(file) {
  const ab = await file.arrayBuffer();
  if (file.name.toLowerCase().endsWith('.fit')) return ab;
  const zip   = await JSZip.loadAsync(ab);
  const entry = Object.values(zip.files).find(e => !e.dir && e.name.toLowerCase().endsWith('.fit'));
  if (!entry) throw new Error('No .fit file found inside ZIP');
  return entry.async('arraybuffer');
}

// ── Main file handler ────────────────────────────────────────────────────────
async function handleFile(file) {
  _showProcessing(true);
  _setError('');
  document.getElementById('metaFile').textContent = file.name;
  try {
    const ab             = await extractFit(file);
    const { records }    = parseFit(ab);
    if (!records.length) throw new Error('File contained no data records');
    const DATA           = processRecords(records);
    renderVisualization(DATA);
  } catch (err) {
    console.error('[PressureWerx]', err);
    _setError(err.message || 'Failed to parse file — is this a Garmin FIT export?');
  } finally {
    _showProcessing(false);
  }
}

// ── Colour scale (RdYlBu_r) ──────────────────────────────────────────────────
const STOPS = [
  [0.00, [44,  123, 182]],
  [0.25, [171, 217, 233]],
  [0.50, [255, 255, 191]],
  [0.75, [253, 174, 97 ]],
  [1.00, [215, 25,  28 ]],
];
function _rgbAt(t) {
  if (t <= 0) return STOPS[0][1];
  if (t >= 1) return STOPS[STOPS.length-1][1];
  for (let i = 0; i < STOPS.length-1; i++) {
    const [t0,c0]=STOPS[i], [t1,c1]=STOPS[i+1];
    if (t >= t0 && t <= t1) {
      const f = (t-t0)/(t1-t0);
      return [Math.round(c0[0]+f*(c1[0]-c0[0])),
              Math.round(c0[1]+f*(c1[1]-c0[1])),
              Math.round(c0[2]+f*(c1[2]-c0[2]))];
    }
  }
}
function _colorFor(p, vmin, vmax) {
  let t = (p-vmin)/(vmax-vmin);
  if (!isFinite(t)) t = 0.5;
  t = Math.max(0, Math.min(1, t));
  const [r,g,b] = _rgbAt(t);
  return `rgb(${r},${g},${b})`;
}

// ── Vis-state module (encapsulated so re-entry is safe) ──────────────────────
let _vis = null;   // holds live vis state; destroyed on "Load different file"

function renderVisualization(DATA) {
  // ── 1. Tear down any previous session ──────────────────────────────────
  if (_vis && _vis.map) { _vis.map.remove(); }
  _vis = {};

  // ── 2. Show vis panel, hide landing ────────────────────────────────────
  document.getElementById('landing').style.display = 'none';
  const visEl = document.getElementById('vis');
  visEl.classList.add('active');

  // ── 3. Populate metadata header ─────────────────────────────────────────
  // Parse t_start_str "HH:MM:SS" to reconstruct wall-clock activity date/time.
  // FIT_EPOCH lets us get the real date from the first timestamp.
  const startDate = new Date((DATA.seg_seconds.length
    ? /* use first seg_seconds=0 base */
      (function(){
        // work backwards: t_start_str is the time, and FIT_EPOCH offset gives UTC date
        return (DATA.duration_s); // we don't have absolute epoch here, approximate
      })()
    : 0) * 1000);
  // Simpler: just use t_start_str / t_end_str as already computed strings.
  const [sh,sm,ss2] = DATA.t_start_str.split(':').map(Number);
  const actDate = new Date(Date.UTC(2000,0,1, sh, sm, ss2)); // dummy date, real time
  // Format duration
  const dur_s = DATA.duration_s;
  const dh = Math.floor(dur_s/3600), dm = Math.floor((dur_s%3600)/60);
  const durStr = dh > 0 ? `${dh}h ${dm}m` : `${dm}m`;

  document.getElementById('metaDate').textContent = DATA.t_date_str;
  document.getElementById('metaTime').textContent =
    `${DATA.t_start_str.slice(0,5)} – ${DATA.t_end_str.slice(0,5)}`;
  document.getElementById('metaDur').textContent  = durStr;
  document.getElementById('metaDist').textContent = `${DATA.total_dist_km.toFixed(1)} km`;
  document.getElementById('metaMean').textContent = `${DATA.mean_pressure.toFixed(2)} PSI`;
  document.getElementById('dataRangeInfo').textContent =
    `Data range: ${DATA.data_min.toFixed(3)} – ${DATA.data_max.toFixed(3)} PSI`;

  // ── 4. Slider state ──────────────────────────────────────────────────────
  const SMIN = DATA.data_min - 0.3, SMAX = DATA.data_max + 0.3;
  let vmin = DATA.default_min, vmax = DATA.default_max;
  const N_SEG = DATA.segments.length;
  let winStart = 0, winEnd = N_SEG;

  const wrap       = document.getElementById('sliderWrap');
  const thumbMin   = document.getElementById('thumbMin');
  const thumbMax   = document.getElementById('thumbMax');
  const rangeDiv   = document.getElementById('sliderRange');
  const vminLbl    = document.getElementById('vminLbl');
  const vmaxLbl    = document.getElementById('vmaxLbl');
  const timeWrap   = document.getElementById('timeSliderWrap');
  const tThumbS    = document.getElementById('timeThumbStart');
  const tThumbE    = document.getElementById('timeThumbEnd');
  const tRangeDiv  = document.getElementById('timeRange');
  const timeStartL = document.getElementById('timeStartLbl');
  const timeEndL   = document.getElementById('timeEndLbl');
  const timeDurL   = document.getElementById('timeDurLbl');

  function valToPct(v) { return (v-SMIN)/(SMAX-SMIN)*100; }
  function pctToVal(p) { return SMIN + (p/100)*(SMAX-SMIN); }

  function updateThumbs() {
    const pn=valToPct(vmin), px=valToPct(vmax);
    thumbMin.style.left=pn+'%'; thumbMax.style.left=px+'%';
    rangeDiv.style.left=pn+'%'; rangeDiv.style.width=(px-pn)+'%';
    vminLbl.textContent=vmin.toFixed(2); vmaxLbl.textContent=vmax.toFixed(2);
  }

  function idxToSec(idx) {
    if (idx<=0) return 0;
    if (idx>=N_SEG) return DATA.duration_s;
    return DATA.seg_seconds[idx];
  }
  function secToClock(s) {
    const [hh,mm,ss]=DATA.t_start_str.split(':').map(Number);
    const tot=hh*3600+mm*60+ss+s;
    const H=Math.floor(tot/3600)%24, M=Math.floor((tot%3600)/60), S=Math.floor(tot%60);
    return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}:${String(S).padStart(2,'0')}`;
  }
  function secToDur(s) {
    if (s<60) return `${Math.round(s)} s`;
    if (s<3600) return `${Math.floor(s/60)} m ${Math.round(s%60)} s`;
    return `${Math.floor(s/3600)} h ${Math.floor((s%3600)/60)} m`;
  }

  function updateTimeThumbs() {
    const ps=(winStart/N_SEG)*100, pe=(winEnd/N_SEG)*100;
    tThumbS.style.left=ps+'%'; tThumbE.style.left=pe+'%';
    tRangeDiv.style.left=ps+'%'; tRangeDiv.style.width=(pe-ps)+'%';
    const s0=idxToSec(winStart), s1=idxToSec(winEnd);
    timeStartL.textContent=secToClock(s0);
    timeEndL.textContent=secToClock(s1);
    timeDurL.textContent=secToDur(s1-s0);
  }

  // ── 5. Leaflet map ───────────────────────────────────────────────────────
  setTimeout(() => {   // let #vis paint before Leaflet measures its container
    const map = L.map('map').setView(DATA.center, 13);
    _vis.map = map;

    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      { attribution:'© Google', maxZoom:20 }).addTo(map);
    L.control.layers({
      'Satellite (Google)': L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{attribution:'© Google',maxZoom:20}),
      'Hybrid (Google)':    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{attribution:'© Google',maxZoom:20}),
      'Satellite (Esri)':   L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}),
      'Streets (OSM)':      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}),
    }).addTo(map);

    const polylines = [];
    const [sh0,sm0,ss0]=DATA.t_start_str.split(':').map(Number), sBase0=sh0*3600+sm0*60+ss0;
    DATA.segments.forEach(([la1,lo1,la2,lo2,p],i)=>{
      const pl = L.polyline([[la1,lo1],[la2,lo2]], { weight:2, opacity:0.95 }).addTo(map);
      pl._pressure = p;
      const tot0=sBase0+(i/N_SEG)*DATA.duration_s;
      const H0=Math.floor(tot0/3600)%24, M0=Math.floor((tot0%3600)/60), S0=Math.floor(tot0%60);
      pl.bindTooltip(
        `${p.toFixed(2)} PSI  ${String(H0).padStart(2,'0')}:${String(M0).padStart(2,'0')}:${String(S0).padStart(2,'0')}`,
        {sticky:true}
      );
      polylines.push(pl);
    });
    _vis.polylines = polylines;

    L.circleMarker(DATA.start, { radius:7, color:'black', weight:2, fillColor:'lime',  fillOpacity:1 }).addTo(map).bindPopup('Start');
    L.circleMarker(DATA.end,   { radius:7, color:'white', weight:2, fillColor:'black', fillOpacity:1 }).addTo(map).bindPopup('End');
    const cursorMarker = L.circleMarker([0,0], {radius:6, color:'#000', weight:2, fillColor:'#000', fillOpacity:0.85, pane:'markerPane'});
    map.fitBounds(DATA.bbox, { padding:[20,20] });
    setTimeout(()=>map.invalidateSize(),100);
    window.addEventListener('resize', ()=>map.invalidateSize());

    // ── 6. applyColors / drawTimeGraph ────────────────────────────────────
    const tgSvg = document.getElementById('timegraph');
    const TG_W=900,TG_H=130,TG_PL=38,TG_PR=8,TG_PT=8,TG_PB=18;
    const NS='http://www.w3.org/2000/svg';
    function el(tag,attrs){
      const e=document.createElementNS(NS,tag);
      for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
      return e;
    }

    polylines.forEach((pl,i)=>{
      pl.on('mouseover',()=>{
        tgSvg.querySelector('#map-cursor')?.remove();
        const x=TG_PL+(i/N_SEG)*(TG_W-TG_PL-TG_PR);
        tgSvg.appendChild(el('line',{id:'map-cursor',x1:x,y1:TG_PT,x2:x,y2:TG_H-TG_PB,stroke:'#dcdcdc','stroke-width':'1.2'}));
      });
      pl.on('mouseout',()=>tgSvg.querySelector('#map-cursor')?.remove());
    });

    function drawTimeGraph() {
      while(tgSvg.firstChild) tgSvg.removeChild(tgSvg.firstChild);
      const pW=TG_W-TG_PL-TG_PR, pH=TG_H-TG_PT-TG_PB;
      const yMin=Math.floor(DATA.data_min*2)/2, yMax=Math.ceil(DATA.data_max*2)/2;
      const yS=p=>TG_PT+(1-(p-yMin)/(yMax-yMin))*pH;
      const xS=i=>TG_PL+(i/N_SEG)*pW;

      tgSvg.appendChild(el('rect',{x:TG_PL,y:TG_PT,width:pW,height:pH,fill:'none',stroke:'#2a2a2a','stroke-width':'0.5'}));
      for(let y=yMin;y<=yMax+1e-9;y+=0.5){
        const yy=yS(y);
        tgSvg.appendChild(el('line',{x1:TG_PL,x2:TG_W-TG_PR,y1:yy,y2:yy,stroke:'#2a2a2a','stroke-width':'0.5'}));
        const t=el('text',{x:TG_PL-4,y:yy+3,'font-size':'9',fill:'#666666','text-anchor':'end'});
        t.textContent=y.toFixed(1); tgSvg.appendChild(t);
      }
      const totMin=DATA.duration_s/60, te=totMin<=30?5:(totMin<=90?15:30);
      const [sh2,sm2,ss3]=DATA.t_start_str.split(':').map(Number), sBase=sh2*3600+sm2*60+ss3;
      for(let t=0;t<=DATA.duration_s;t+=te*60){
        const xx=xS((t/DATA.duration_s)*N_SEG);
        tgSvg.appendChild(el('line',{x1:xx,x2:xx,y1:TG_H-TG_PB,y2:TG_H-TG_PB+3,stroke:'#444444','stroke-width':'0.5'}));
        const tot=sBase+t, H2=Math.floor(tot/3600)%24, M2=Math.floor((tot%3600)/60);
        const lb=el('text',{x:xx,y:TG_H-4,'font-size':'9',fill:'#666666','text-anchor':'middle'});
        lb.textContent=`${String(H2).padStart(2,'0')}:${String(M2).padStart(2,'0')}`; tgSvg.appendChild(lb);
      }
      const yl=el('text',{x:4,y:TG_PT+6,'font-size':'9',fill:'#666666'}); yl.textContent='PSI'; tgSvg.appendChild(yl);

      const pressures=DATA.segments.map(s=>s[4]);
      for(let i=0;i<N_SEG;i++){
        const p=pressures[i], inW=(i>=winStart&&i<winEnd);
        const seg=el('line',{
          x1:xS(i),y1:yS(p),x2:xS(i+1),y2:(i+1<N_SEG?yS(pressures[i+1]):yS(p)),
          stroke:inW?_colorFor(p,vmin,vmax):'#dcdcdc',
          'stroke-width':inW?'2.0':'1.2','stroke-opacity':inW?'0.95':'0.55'
        });
        tgSvg.appendChild(seg);
      }
      if(winStart>0){const v=el('line',{x1:xS(winStart),x2:xS(winStart),y1:TG_PT,y2:TG_H-TG_PB,stroke:'#888888','stroke-width':'1.2','stroke-dasharray':'4,2'});tgSvg.appendChild(v);}
      if(winEnd<N_SEG){const v=el('line',{x1:xS(winEnd),x2:xS(winEnd),y1:TG_PT,y2:TG_H-TG_PB,stroke:'#888888','stroke-width':'1.2','stroke-dasharray':'4,2'});tgSvg.appendChild(v);}
      const tip=el('g',{visibility:'hidden'});
      const tipBg=el('rect',{rx:'3',ry:'3',fill:'#1a1a1a',stroke:'#555','stroke-width':'0.5'});
      const tipTxt=el('text',{'font-size':'11',fill:'#e0e0e0','text-anchor':'middle','dominant-baseline':'middle'});
      tip.appendChild(tipBg); tip.appendChild(tipTxt); tgSvg.appendChild(tip);
      const overlay=el('rect',{x:TG_PL,y:TG_PT,width:pW,height:pH,fill:'none','pointer-events':'all',cursor:'crosshair'});
      overlay.addEventListener('mousemove',e=>{
        const r=tgSvg.getBoundingClientRect();
        const svgX=(e.clientX-r.left)*(TG_W/r.width);
        const idx=Math.max(0,Math.min(N_SEG-1,Math.round((svgX-TG_PL)/pW*N_SEG)));
        const psi=pressures[idx];
        const tot=sBase+(idx/N_SEG)*DATA.duration_s;
        const H3=Math.floor(tot/3600)%24, M3=Math.floor((tot%3600)/60), S3=Math.floor(tot%60);
        tipTxt.textContent=`${psi.toFixed(2)} PSI  ${String(H3).padStart(2,'0')}:${String(M3).padStart(2,'0')}:${String(S3).padStart(2,'0')}`;
        const tw=tipTxt.getComputedTextLength()+12, th=16;
        const tx=Math.max(TG_PL+tw/2,Math.min(TG_W-TG_PR-tw/2,svgX));
        tipBg.setAttribute('x',tx-tw/2); tipBg.setAttribute('y',TG_PT+2);
        tipBg.setAttribute('width',tw); tipBg.setAttribute('height',th);
        tipTxt.setAttribute('x',tx); tipTxt.setAttribute('y',TG_PT+2+th/2);
        tip.setAttribute('visibility','visible');
        const [la1c,lo1c,la2c,lo2c]=DATA.segments[idx];
        cursorMarker.setLatLng([(la1c+la2c)/2,(lo1c+lo2c)/2]);
        if(!map.hasLayer(cursorMarker)) cursorMarker.addTo(map);
      });
      overlay.addEventListener('mouseleave',()=>{
        tip.setAttribute('visibility','hidden');
        if(map.hasLayer(cursorMarker)) cursorMarker.remove();
      });
      tgSvg.appendChild(overlay);
    }

    function applyColors() {
      for(let i=0;i<polylines.length;i++){
        const pl=polylines[i], inW=(i>=winStart&&i<winEnd);
        pl.setStyle(inW
          ?{color:_colorFor(pl._pressure,vmin,vmax),weight:2,opacity:0.95}
          :{color:'#dcdcdc',weight:0.8,opacity:0.2});
      }
      drawTimeGraph();
    }

    // ── 7. Slider drag events ──────────────────────────────────────────────
    let dragging=null;
    const startDrag=w=>e=>{e.preventDefault();dragging=w;};
    thumbMin.addEventListener('mousedown', startDrag('min'));
    thumbMin.addEventListener('touchstart',startDrag('min'),{passive:false});
    thumbMax.addEventListener('mousedown', startDrag('max'));
    thumbMax.addEventListener('touchstart',startDrag('max'),{passive:false});
    tThumbS.addEventListener('mousedown',  startDrag('tStart'));
    tThumbS.addEventListener('touchstart', startDrag('tStart'),{passive:false});
    tThumbE.addEventListener('mousedown',  startDrag('tEnd'));
    tThumbE.addEventListener('touchstart', startDrag('tEnd'),{passive:false});

    const getX=e=>e.touches?.length?e.touches[0].clientX:e.clientX;
    const onDrag=e=>{
      if(!dragging)return; e.preventDefault();
      const x=getX(e);
      if(dragging==='min'||dragging==='max'){
        const r=wrap.getBoundingClientRect();
        let v=Math.round(pctToVal(Math.max(0,Math.min(100,(x-r.left)/r.width*100)))*100)/100;
        if(dragging==='min') vmin=Math.min(v,vmax-0.01);
        else                 vmax=Math.max(v,vmin+0.01);
        updateThumbs(); applyColors();
      } else {
        const r=timeWrap.getBoundingClientRect();
        const idx=Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*N_SEG);
        if(dragging==='tStart') winStart=Math.min(idx,winEnd-1);
        else                    winEnd=Math.max(idx,winStart+1);
        updateTimeThumbs(); applyColors();
      }
    };
    document.addEventListener('mousemove',onDrag);
    document.addEventListener('touchmove',onDrag,{passive:false});
    document.addEventListener('mouseup',  ()=>{dragging=null;});
    document.addEventListener('touchend', ()=>{dragging=null;});
    _vis.cleanup = () => {
      document.removeEventListener('mousemove',onDrag);
      document.removeEventListener('touchmove',onDrag);
    };

    // ── 8. Preset buttons & keyboard shortcuts ─────────────────────────────
    document.getElementById('resetDefaults').onclick=()=>{vmin=DATA.default_min;vmax=DATA.default_max;updateThumbs();applyColors();};
    document.getElementById('resetData').onclick=()=>{vmin=DATA.data_min;vmax=DATA.data_max;updateThumbs();applyColors();};
    document.getElementById('resetTime').onclick=()=>{winStart=0;winEnd=N_SEG;updateTimeThumbs();applyColors();};

    const onKey=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      if(e.key==='r'||e.key==='R'){vmin=DATA.default_min;vmax=DATA.default_max;updateThumbs();applyColors();}
      else if(e.key==='t'||e.key==='T'){winStart=0;winEnd=N_SEG;updateTimeThumbs();applyColors();}
      else if(e.key==='f'||e.key==='F'){vmin=DATA.data_min;vmax=DATA.data_max;updateThumbs();applyColors();}
    };
    document.addEventListener('keydown',onKey);
    _vis.cleanupKeys = () => document.removeEventListener('keydown',onKey);

    // ── 9. Initial render ──────────────────────────────────────────────────
    updateThumbs();
    updateTimeThumbs();
    applyColors();

  }, 50);  // end setTimeout — gives #vis time to paint before Leaflet measures
}

// ── "Load different file" button ─────────────────────────────────────────────
document.getElementById('loadDiff').addEventListener('click', () => {
  // Tear down vis
  if (_vis) {
    if (_vis.map)         _vis.map.remove();
    if (_vis.cleanup)     _vis.cleanup();
    if (_vis.cleanupKeys) _vis.cleanupKeys();
    _vis = null;
  }
  document.getElementById('vis').classList.remove('active');
  document.getElementById('landing').style.display = '';
  _setError('');
});

// ── UI helpers ───────────────────────────────────────────────────────────────
function _showProcessing(on) {
  document.getElementById('processing').style.display = on ? 'flex' : 'none';
}
function _setError(msg) {
  document.getElementById('dzError').textContent = msg;
}

// ── Event wiring ─────────────────────────────────────────────────────────────
const dz      = document.getElementById('dropzone');
const fileIn  = document.getElementById('fileInput');
const loadBtn = document.getElementById('loadExample');

fileIn.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) handleFile(f);
  fileIn.value = '';   // allow re-selecting the same file
});

dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('drag-over'); });
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const n = f.name.toLowerCase();
  if (!n.endsWith('.fit') && !n.endsWith('.zip')) {
    _setError('Please drop a .fit or .zip file');
    return;
  }
  handleFile(f);
});

// "Load example session" — decodes the embedded base64 ZIP and runs it
// through the same pipeline as a user-dropped file.
function _b64ToAB(b64) {
  const bin = atob(b64);
  const u8  = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

loadBtn.addEventListener('click', () => {
  handleFile(new File([_b64ToAB(EXAMPLE_ZIP_B64)], '23157999972.zip'));
});
</script>
